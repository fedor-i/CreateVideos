<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 548" role="img" aria-label="CreateVideos pipeline">
<title>CreateVideos pipeline flow</title>
<desc>A narration script feeds synth.py, which produces audio and a duration manifest that times three producers: scene.py for HTML animations, live.py plus mux.py for recording any website, and cards.py for title and divider cards. Their clips converge into assemble.py, which outputs the final 1080p video; music.py optionally adds a ducked music bed to it.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .th{font-size:14px;font-weight:500}
  .ts{font-size:12px;font-weight:400}
  .neutral{fill:#73726c}
  .edge{stroke:#73726c;stroke-width:1.5;fill:none;stroke-linecap:round}
  .gray{fill:#F1EFE8;stroke:#5F5E5A}
  .amber{fill:#FAEEDA;stroke:#BA7517}
  .teal{fill:#E1F5EE;stroke:#0F6E56}
  .purple{fill:#EEEDFE;stroke:#534AB7}
  .green{fill:#EAF3DE;stroke:#3B6D11}
  .t-gray{fill:#2C2C2A}.t-amber{fill:#412402}.t-teal{fill:#04342C}.t-purple{fill:#26215C}.t-green{fill:#173404}
  @media (prefers-color-scheme:dark){
    .neutral{fill:#9c9a92}
    .edge{stroke:#9c9a92}
    .gray{fill:#444441;stroke:#B4B2A9}
    .amber{fill:#633806;stroke:#FAC775}
    .teal{fill:#085041;stroke:#9FE1CB}
    .purple{fill:#3C3489;stroke:#CECBF6}
    .green{fill:#27500A;stroke:#C0DD97}
    .t-gray{fill:#F1EFE8}.t-amber{fill:#FAEEDA}.t-teal{fill:#E1F5EE}.t-purple{fill:#EEEDFE}.t-green{fill:#EAF3DE}
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="240" y="30" width="200" height="44" rx="8" stroke-width="0.5" class="gray"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" class="th t-gray">narration script</text>
<line x1="340" y1="74" x2="340" y2="100" class="edge" marker-end="url(#arrow)"/>

<rect x="240" y="104" width="200" height="56" rx="8" stroke-width="0.5" class="amber"/>
<text x="340" y="126" text-anchor="middle" dominant-baseline="central" class="th t-amber">synth.py &#183; the clock</text>
<text x="340" y="144" text-anchor="middle" dominant-baseline="central" class="ts t-amber">mp3 + duration manifest</text>

<line x1="330" y1="160" x2="150" y2="220" class="edge" marker-end="url(#arrow)"/>
<line x1="340" y1="160" x2="340" y2="220" class="edge" marker-end="url(#arrow)"/>
<line x1="350" y1="160" x2="530" y2="220" class="edge" marker-end="url(#arrow)"/>

<rect x="50" y="224" width="180" height="56" rx="8" stroke-width="0.5" class="teal"/>
<text x="140" y="246" text-anchor="middle" dominant-baseline="central" class="th t-teal">scene.py</text>
<text x="140" y="264" text-anchor="middle" dominant-baseline="central" class="ts t-teal">HTML animation</text>

<rect x="250" y="224" width="180" height="56" rx="8" stroke-width="1" class="teal"/>
<text x="340" y="246" text-anchor="middle" dominant-baseline="central" class="th t-teal">live.py + mux.py</text>
<text x="340" y="264" text-anchor="middle" dominant-baseline="central" class="ts t-teal">records any website</text>

<rect x="450" y="224" width="180" height="56" rx="8" stroke-width="0.5" class="teal"/>
<text x="540" y="246" text-anchor="middle" dominant-baseline="central" class="th t-teal">cards.py</text>
<text x="540" y="264" text-anchor="middle" dominant-baseline="central" class="ts t-teal">title + dividers</text>

<text x="408" y="312" text-anchor="middle" dominant-baseline="central" class="ts neutral">clips (mp4)</text>
<line x1="150" y1="280" x2="330" y2="340" class="edge" marker-end="url(#arrow)"/>
<line x1="340" y1="280" x2="340" y2="340" class="edge" marker-end="url(#arrow)"/>
<line x1="530" y1="280" x2="350" y2="340" class="edge" marker-end="url(#arrow)"/>

<rect x="240" y="344" width="200" height="56" rx="8" stroke-width="0.5" class="purple"/>
<text x="340" y="366" text-anchor="middle" dominant-baseline="central" class="th t-purple">assemble.py</text>
<text x="340" y="384" text-anchor="middle" dominant-baseline="central" class="ts t-purple">normalize + concat</text>
<line x1="340" y1="400" x2="340" y2="448" class="edge" marker-end="url(#arrow)"/>

<rect x="240" y="452" width="200" height="56" rx="8" stroke-width="0.5" class="green"/>
<text x="340" y="474" text-anchor="middle" dominant-baseline="central" class="th t-green">final video</text>
<text x="340" y="492" text-anchor="middle" dominant-baseline="central" class="ts t-green">1080p / 60fps mp4</text>

<line x1="440" y1="480" x2="488" y2="480" class="edge" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<rect x="490" y="452" width="150" height="56" rx="8" stroke-width="0.5" stroke-dasharray="5 5" class="gray"/>
<text x="565" y="474" text-anchor="middle" dominant-baseline="central" class="th t-gray">music.py</text>
<text x="565" y="492" text-anchor="middle" dominant-baseline="central" class="ts t-gray">optional bed</text>
</svg>
